apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-sync-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-sync-service
  template:
    metadata:
      labels:
        app: inventory-sync-service
    spec:
      containers:
        - name: inventory-sync-service
          image: inventory-sync-service:latest
          imagePullPolicy: Never

          env:
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092

          ports:
            - containerPort: 9093
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-sync-service
spec:
  selector:
    app: inventory-sync-service
  ports:
    - port: 9093
      targetPort: 9093
