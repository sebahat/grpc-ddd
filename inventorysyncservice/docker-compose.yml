version: '3.8'

services:
  inventory-sync-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventory-sync-service
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "9093:9093"
    networks:
      - microservices-net
    restart: unless-stopped

networks:
  microservices-net:
    external: true
